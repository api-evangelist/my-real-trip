- name: MyRealTrip Partner API
  description: >-
    Marketing-partner REST API for MyRealTrip. Search flights (domestic and
    international, lowest-fare calendars), accommodations, and tours/tickets;
    generate trackable MyLink short URLs; and retrieve revenue and reservation
    reports for affiliate reconciliation. Authenticated with a Bearer API key,
    JSON over HTTPS, per-minute rate limits.
