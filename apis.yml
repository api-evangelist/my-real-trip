aid: my-real-trip
name: My Real Trip
description: >-
  My Real Trip (마이리얼트립) is South Korea's largest online travel platform,
  founded in 2012, selling flights, stays, tours, tickets, and activities across
  680+ cities in 80+ countries to roughly 5 million monthly active users. For
  developers it publishes a Partner API (partner-ext-api.myrealtrip.com) that
  lets marketing/affiliate partners search products, generate trackable MyLink
  short links, and pull revenue and reservation reports, secured with a Bearer
  API key. It also operates an official public Model Context Protocol (MCP)
  server that exposes real-time flight, stay, and tour/activity search to AI
  assistants such as Claude, Cursor, and Gemini CLI.
